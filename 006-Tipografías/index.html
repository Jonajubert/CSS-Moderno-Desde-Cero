<!DOCTYPE html>
<!-- Indica al navegador que utilizamos HTML5 -->

<html lang="es">

<head>

    <!-- Permite mostrar correctamente caracteres especiales -->
    <meta charset="UTF-8">

    <!-- Adapta la página a diferentes tamaños de pantalla -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- Texto visible en la pestaña -->
    <title>Tipografías en CSS</title>

    <!-- Conectamos nuestro archivo CSS -->
    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <!-- Encabezado principal -->
    <header>

        <h1>CSS Moderno Desde Cero</h1>

        <p class="subtitulo">
            Aprendiendo tipografías con CSS.
        </p>

    </header>


    <!-- Contenido principal -->
    <main>

        <section>

            <h2>¿Por qué importa la tipografía?</h2>

            <p>
                Una buena tipografía ayuda a organizar
                visualmente el contenido y facilita
                su lectura.
            </p>

            <p class="destacado">
                CSS nos permite controlar el tamaño,
                grosor, estilo y espaciado del texto.
            </p>

        </section>

    </main>


    <!-- Pie de página -->
    <footer>

        <p>Creado por Jonatan Jubert</p>

    </footer>

</body>

</html>
