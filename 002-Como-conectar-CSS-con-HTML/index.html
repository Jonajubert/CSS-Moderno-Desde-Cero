<!DOCTYPE html>

<!-- Documento HTML5 -->
<html lang="es">

<head>

    <!-- Configuración básica -->
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Conectando CSS con HTML</title>

    <!--
        Forma recomendada.
        Conecta un archivo CSS externo.
    -->
    <link rel="stylesheet" href="styles.css">

    <!--
        CSS interno.
        Se escribe dentro del documento HTML.
    -->
    <style>

        h2{
            color: steelblue;
        }

    </style>

</head>

<body>

    <header>

        <h1>CSS Moderno</h1>

    </header>

    <main>

        <section>

            <article>

                <h2>Conectando CSS</h2>

                <p class="descripcion">
                    Este párrafo obtiene sus estilos desde
                    un archivo CSS externo.
                </p>

                <!-- CSS en línea -->
                <button style="background:#0d6efd;color:white;">
                    Botón con estilo en línea
                </button>

            </article>

        </section>

    </main>

</body>

</html>
