<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Permite mostrar correctamente caracteres especiales -->
    <meta charset="UTF-8">

    <!-- Adapta la página a celulares y tablets -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- Título visible en la pestaña del navegador -->
    <title>Selectores básicos en CSS</title>

    <!-- Conecta el archivo CSS externo -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Encabezado principal -->
    <header>
        <h1 id="titulo-principal">CSS Moderno Desde Cero</h1>
    </header>

    <!-- Contenido principal -->
    <main>

        <section>

            <h2>Selectores básicos</h2>

            <p>
                CSS utiliza selectores para identificar
                qué elementos HTML queremos modificar.
            </p>

            <article class="destacado">

                <h3>Selector de clase</h3>

                <p>
                    Este contenido utiliza la clase
                    "destacado".
                </p>

            </article>

        </section>

    </main>

    <!-- Información complementaria -->
    <aside>

        <h3>Dato adicional</h3>

        <p class="destacado">
            Una misma clase puede utilizarse
            en varios elementos.
        </p>

    </aside>

    <!-- Pie de página -->
    <footer>

        <p>Creado por Jonatan Jubert</p>

    </footer>

</body>

</html>
