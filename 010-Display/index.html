<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Display en CSS</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main>

        <h1>Display en CSS</h1>

        <section>
            <h2>display: block</h2>

            <div class="block">Elemento 1</div>
            <div class="block">Elemento 2</div>
        </section>


        <section>
            <h2>display: inline</h2>

            <span class="inline">Elemento 1</span>
            <span class="inline">Elemento 2</span>
        </section>


        <section>
            <h2>display: inline-block</h2>

            <span class="inline-block">Elemento 1</span>
            <span class="inline-block">Elemento 2</span>
        </section>

    </main>

</body>

</html>
