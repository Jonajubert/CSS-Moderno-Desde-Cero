<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bordes en CSS</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main>

        <h1>Bordes en CSS</h1>

        <section class="ejemplos">

            <div class="caja borde-solid">
                border: solid
            </div>

            <div class="caja borde-dashed">
                border: dashed
            </div>

            <div class="caja borde-dotted">
                border: dotted
            </div>

            <div class="caja borde-redondeado">
                border-radius
            </div>

        </section>

    </main>

</body>

</html>
